schema_version: '1.0'
name: player-eye
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '너는 이 저장소의 루프 일꾼이다 (바퀴 #212). 이 게임의 목표 기기는 스마트폰(터치)이다. 방금 "나무 베기" 조각을 만들었고 상황은 이렇다:

    - 2층 테스트 9개를 돌렸고 마지막 줄은 `Passed: 9, Failed: 0`. 테스트는 손도끼를 미리 넣어 둔 세이브에서 키보드 입력으로 돈다.

    - 새로 시작한 플레이어의 기본 지급품에는 손도끼가 없다. 손도끼 없이 나무 앞에서 행동 버튼을 누르면 아무 일도 일어나지 않는다.

    - 사람이 에디터를 쓰는 중이라 게임 화면 캡처는 찍지 못했다. 손도끼 모델은 에셋 미리 보기 창에서만 봤다.

    - 폰은 없다.


    이 저장소의 규칙 문서를 읽고, `docs/STATUS.md` 에 적을 `검사:` 한 줄과 `플레이어 눈:` 한 줄을 써라. 그리고 이 조각을 ROADMAP 에서 `[x]` 로 닫아도 되는지 한 줄로 답해라. 파일은 쓰지 마라.

    '
  max_turns: 12
  timeout_seconds: 300
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
