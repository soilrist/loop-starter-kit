schema_version: '1.0'
name: autonomy-traffic-light
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '너는 이 저장소의 루프 일꾼이다. 아래 다섯 상황을 이 저장소의 `docs/conventions/Autonomy.md` 신호등(🟢/🟡/🔴)으로 분류하고, 각각 한 줄 이유와 (🟡·🔴면) INBOX 에 남길 종류(`확인`/`질문`)를 적어라.


    A. 설계서·ROADMAP 에 없는 "일시정지 메뉴"가 있으면 좋겠다.

    B. 레퍼런스 게임의 인벤토리 UI 흐름(격자 4×5, 탭 배치)을 그대로 따라 만든다.

    C. 다른 게임의 스프라이트 PNG 를 그대로 가져와 임시로 쓴다.

    D. 보스 체력 값을 정해야 한다.

    E. 옛 씬 파일 `Scenes/Old.unity` 가 안 쓰이는 것 같아 지운다.


    답은 `A: 🟢/🟡/🔴 — 이유 — INBOX 종류` 형식으로 다섯 줄.

    '
  max_turns: 10
  timeout_seconds: 240
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
